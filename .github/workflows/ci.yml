name: CI

on:
  push:
    branches: [ main, DAG, development ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compile
        run: ./mvnw -B -ntp compile

      # Unit + Spring context tests. The Docker adversarial suite is @EnabledIf(dockerAvailable)
      # and runs in security.yml, where the daemon is guaranteed and the runtime budget is larger.
      - name: Pull test images
        run: |
          docker pull postgres:16-alpine
          docker pull python:3.11-slim

      - name: Test
        run: ./mvnw -B -ntp verify

      # The durable-runtime and sandbox suites are @EnabledIf(dockerAvailable) and would SKIP
      # silently on a runner without a daemon, reporting green while verifying nothing.
      #
      # Counted by summing across reports whose name starts with the suite: JUnit writes a separate
      # report per @Nested class, and the outer class legitimately reports "Tests run: 0" when all
      # of its tests live in nested classes. Matching the outer report alone gives a false failure.
      - name: Fail if the container-backed suites did not actually run
        run: |
          check_suite() {
            prefix="target/surefire-reports/$1"
            total=$(cat "$prefix"*.txt 2>/dev/null \
                    | grep -o 'Tests run: [0-9]*' | grep -o '[0-9]*' \
                    | awk '{s+=$1} END {print s+0}')
            if [ "$total" -lt "$2" ]; then
              echo "FAIL: $1 ran $total tests, expected at least $2 (skipped or missing)"
              cat "$prefix"*.txt 2>/dev/null | head -20
              return 1
            fi
            echo "ok: $1 ran $total tests"
          }
          check_suite com.chatbot.agent.runtime.persistence.DurableRuntimeTest 15
          check_suite com.chatbot.agent.runtime.exec.EndToEndRunTest 12
          check_suite com.chatbot.agent.runtime.approval.ApprovalWorkflowTest 8
          check_suite com.chatbot.agent.runtime.plan.PlannerToRuntimeTest 12
          check_suite com.chatbot.agent.service.tools.sandbox.DockerSandboxAdversarialTest 12

      - name: Coverage report
        run: ./mvnw -B -ntp jacoco:report

      - name: Publish coverage summary
        if: always()
        run: |
          REPORT=target/site/jacoco/jacoco.csv
          if [ ! -f "$REPORT" ]; then echo "No coverage report produced." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          echo "### Coverage (baseline — no gate yet)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Line cov | Branch cov |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          awk -F, 'NR>1 {lm[$2]+=$8; lc[$2]+=$9; bm[$2]+=$6; bc[$2]+=$7}
                   END {for (p in lm) {
                     lt=lm[p]+lc[p]; bt=bm[p]+bc[p];
                     printf "| %s | %.1f%% | %s |\n", p,
                       (lt? 100*lc[p]/lt : 0),
                       (bt? sprintf("%.1f%%", 100*bc[p]/bt) : "n/a") }}' "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            target/sbom.json
            target/sbom.xml
          retention-days: 90

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # -Xlint with -Werror would fail on pre-existing warnings across the tree; surface them
      # instead and tighten once the backlog is cleared.
      - name: Compiler warnings
        run: ./mvnw -B -ntp clean compile -Dmaven.compiler.showWarnings=true

      # Docs in this repository link to the code that backs each claim. A broken link is the first
      # visible symptom of documentation drifting away from the implementation, so it fails the build.
      # Fails on broken links, broken anchors, and build-session narration. Docs here link to the
      # code backing each claim, so a broken link is the first visible symptom of documentation
      # drifting from the implementation.
      - name: Documentation quality gate
        run: python3 tools/check-docs.py

  dependency-scan:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Resolve dependencies
        run: ./mvnw -B -ntp dependency:go-offline

      # Scans the built dependency tree. Informational for now: this repository has never had a
      # vulnerability baseline, so failing the build on first run would block every PR. Promote to
      # a gate once the initial findings are triaged.
      # Pinned to a commit SHA, not a tag. A tag is mutable, and a security-scanning action that
      # can be silently repointed is a supply-chain hole in the very job meant to close one.
      # (The original reference here was `@0.24.0`, a version that has never existed - the tags are
      # v-prefixed - so the job failed to resolve and never ran.)
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: table
