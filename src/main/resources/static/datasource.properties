# ============================================================================
# Dynamic (per-tool) datasource registry.
#
# NO SECRET MAY APPEAR IN THIS FILE. It is committed to a public repository.
#
# Values support ${ENV_VAR} and ${ENV_VAR:default} placeholders, resolved at
# startup by DynamicDataSourceConfig#resolvePlaceholders. A placeholder whose
# variable is unset resolves to empty, which fails the required-property check
# below with a clear message rather than silently connecting with blank creds.
#
# See .env.example for the variable names.
# ============================================================================

datasources=BS2

# BS2 - demo datasource backing the SQL tool examples (synthetic data; see Employees.sql)
BS2.driverClassName=com.mysql.cj.jdbc.Driver
BS2.url=${BS2_DB_URL:jdbc:mysql://localhost:3306/chatbot_db?useSSL=false&allowPublicKeyRetrieval=true}
BS2.username=${BS2_DB_USERNAME:}
BS2.password=${BS2_DB_PASSWORD:}
BS2.initialPoolSize=2
BS2.maxPoolSize=10
BS2.minPoolSize=1
BS2.isolationLevel=READ_COMMITTED
BS2.validationQuery=SELECT 1
