server:
  port: 8080

spring:
  datasource:
    url: ${APP_DB_URL:jdbc:mysql://localhost:3306/chatbot_db?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${APP_DB_USERNAME:}
    password: ${APP_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    initialization-mode: always
    platform: mysql
    sql-script-encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true
      file-size-threshold: 2MB

# All external provider configuration is environment-supplied. No value here may be a secret.
# See .env.example for the full variable list.
azure:
  openai:
    base-url: ${AZURE_OPENAI_ENDPOINT:}
    api-key: ${AZURE_OPENAI_API_KEY:}
    deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-35-turbo}
    api-version: ${AZURE_OPENAI_API_VERSION:2024-02-01}
    # Azure AI Search is a distinct service with its own key. These were previously
    # collapsed onto the OpenAI key, which is both a bug and a blast-radius problem.
    search-endpoint: ${AZURE_SEARCH_ENDPOINT:}
    search-key: ${AZURE_SEARCH_API_KEY:}
    search-index: ${AZURE_SEARCH_INDEX:agent-index}

llama:
  base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
  embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  generation-model: ${OLLAMA_GENERATION_MODEL:llama2}
  vector-db:
    url: ${VECTOR_DB_URL:jdbc:postgresql://localhost:5432/vector_store}
    username: ${VECTOR_DB_USERNAME:}
    password: ${VECTOR_DB_PASSWORD:}

document:
  upload-dir: ${DOCUMENT_UPLOAD_DIR:./uploads}
  chunk-size: 1000
  chunk-overlap: 200

tool-execution:
  inter-tool-communication:
    enabled: true
    max-chain-depth: 5
    circular-dependency-check: true

  python:
    executor-type: STDIN_STDOUT_PROTOCOL

    # DOCKER = each execution runs in a disposable, network-less, resource-capped container.
    # LOCAL  = NOT a sandbox. Runs tool code on the host as the JVM user with no isolation at all.
    #          Startup FAILS on LOCAL unless AGENT_ALLOW_UNSAFE_LOCAL_EXECUTION=true is also set.
    sandbox: ${AGENT_PYTHON_SANDBOX:DOCKER}

    # Where generated scripts are staged. With sandbox=DOCKER this path is bind-mounted into the
    # container read-only, so it must be visible to the Docker daemon at the same path.
    # Defaults to ${java.io.tmpdir}/eztool-scripts when unset.
    script-dir:

    docker:
      binary: "docker"
      image: "python:3.11-slim"    # pin to a digest in production
      network: "none"              # tool code gets no network; eztool() runs over stdin/stdout
      memory: "256m"
      cpus: "0.5"
      pids-limit: 64
      user: "65534:65534"
      read-only: true
      tmpfs-size: "16m"

    interpreter-path: "python3"
    interpreter-args:
      - "-I"                       # CPython isolated mode ("--isolated" is not a valid flag)
    max-code-size-bytes: 100000
    allowed-modules:
      - json
      - math
      - datetime
      - re
      - statistics
    protocol:
      request-marker: "###EZTOOL_REQUEST###"
      request-end-marker: "###EZTOOL_REQUEST_END###"
      response-marker: "###EZTOOL_RESPONSE###"
      response-end-marker: "###EZTOOL_RESPONSE_END###"
      result-marker: "###RESULT###"
      buffer-size: 8192
      read-timeout-ms: 5000
      max-message-size: 10000000

  javascript:
    executor-type: GRAALVM_BINDING
    max-code-size-bytes: 100000
    allow-console-log: false
    engine-version: "22.3.0"

  tool-registry:
    cache-enabled: true
    cache-ttl-seconds: 300
    preload-on-startup: true
    max-cache-size: 1000

  security:
    max-tool-calls-per-request: 20
    block-dangerous-patterns: true
    enforce-guardrails: true

  timeout:
    individual-tool-timeout-ms: 30000
    aggregate-enabled: true
    aggregate-timeout-ms: 60000
    timeout-strategy: AGGREGATE
    process-wait-timeout-ms: 5000

  error-handling:
    propagate-errors: true
    include-stack-trace: false
    include-tool-chain: true
    include-execution-context: true
    max-error-message-length: 1000

  performance:
    thread-pool-size: 10
    thread-pool-queue-size: 100
    thread-keep-alive-seconds: 60

  monitoring:
    log-execution-chain: true
    log-timing-details: true
    alert-on-timeout: true
    alert-on-circular-dependency: true
    alert-on-memory-exhaustion: true
    leak-detection-interval-seconds: 60
    leak-detection-threshold-ms: 300000
    enable-metrics: true
    enable-health-checks: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: always

  # NOTE: these moved in Spring Boot 3. The old
  # `management.metrics.export.prometheus.enabled` key was silently ignored.
  prometheus:
    metrics:
      export:
        enabled: true
  jmx:
    metrics:
      export:
        enabled: true        # AppDynamics Java Agent harvests these via JMX metric rules

  metrics:
    tags:
      application: agent-platform   # becomes a dimension on every meter
    distribution:
      percentiles-histogram:
        tool.execution: true
        llm.request: true
      slo:
        tool.execution: 100ms,500ms,1s,5s,15s,30s
        llm.request: 500ms,1s,2s,5s,10s,30s

# ============================================================================
# Metric collection -> local metric_sample table (durable store for ML)
# Schema: src/main/resources/static/metrics_store_schema.sql
# Guide:  METRICS_GUIDE.md
# ============================================================================
metrics-collection:
  enabled: false              # master switch
  interval-seconds: 60        # how often to poll
  lookback-seconds: 300       # window per poll; > interval so windows overlap and cannot gap
  retention-days: 90          # 0 = keep forever
  retention-cron: "0 30 3 * * *"

  prometheus:
    enabled: false            # needs a Prometheus server running (see METRICS_GUIDE.md)
    url: http://localhost:9090
    step: 60s                 # must be >= your Prometheus scrape_interval
    timeout-seconds: 30
    queries:
      # Raw counters are stored deliberately: a rate() baked in at collection time
      # cannot be undone later, but a counter can be re-rated over any window.
      - name: tool_execution_seconds_count
        promql: 'tool_execution_seconds_count'
      - name: tool_execution_seconds_sum
        promql: 'tool_execution_seconds_sum'
      - name: tool_execution_error_total
        promql: 'tool_execution_error_total'
      - name: tool_sandbox_killed_total
        promql: 'tool_sandbox_killed_total'
      - name: llm_request_seconds_count
        promql: 'llm_request_seconds_count'
      - name: llm_request_seconds_sum
        promql: 'llm_request_seconds_sum'
      - name: guardrail_violation_total
        promql: 'guardrail_violation_total'
      # Derived series, handy to have precomputed for quick exploration
      - name: tool_latency_p95_seconds
        promql: 'histogram_quantile(0.95, sum(rate(tool_execution_seconds_bucket[5m])) by (le, tool))'
      - name: tool_error_rate
        promql: 'sum(rate(tool_execution_error_total[5m])) by (tool)'
      # Host / JVM context - the covariates that explain latency spikes
      - name: jvm_memory_used_bytes
        promql: 'jvm_memory_used_bytes{area="heap"}'
      - name: process_cpu_usage
        promql: 'process_cpu_usage'
      - name: http_server_requests_seconds_count
        promql: 'http_server_requests_seconds_count'

  appdynamics:
    enabled: false            # needs a Controller + credentials
    controller-url: ${METRICS_APPD_URL:}
    application-name: agent-platform
    username: ${METRICS_APPD_USER:}      # must be user@account
    password: ${METRICS_APPD_PASSWORD:}  # never commit this
    timeout-seconds: 30
    metric-paths:
      - "Overall Application Performance|Average Response Time (ms)"
      - "Overall Application Performance|Calls per Minute"
      - "Overall Application Performance|Errors per Minute"
      - "Overall Application Performance|Slow Calls"
      - "Overall Application Performance|Stall Count"

logging:
  level:
    com.chatbot.agent.service.tools: INFO
    com.chatbot.agent.health: INFO
    com.chatbot.agent.metrics: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"